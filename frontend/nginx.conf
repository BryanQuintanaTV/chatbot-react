# Nginx configuration for Tec Bot React App
# Place this in your nginx site configuration or include it

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain
    server_name chatbot.bryanquintana.com;

    # Root directory (dist folder after build)
    root /var/www/chatbot/dist;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/manifest+json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # MIME types - THIS IS CRITICAL
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ensure JavaScript files are served with correct MIME type
    location ~* \.jsx?$ {
        types {
            application/javascript js jsx;
        }
        add_header Content-Type "application/javascript" always;
        try_files $uri =404;
    }

    # Ensure CSS files are served correctly
    location ~* \.css$ {
        add_header Content-Type "text/css" always;
        try_files $uri =404;
    }

    # Service Worker
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Content-Type "application/javascript" always;
        try_files $uri =404;
    }

    # Manifest
    location /manifest.json {
        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API proxy (if needed)
    location /api/ {
        proxy_pass http://localhost:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Offline page fallback
    location /offline.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

