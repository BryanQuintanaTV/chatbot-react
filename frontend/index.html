<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Prevent caching to ensure maintenance mode updates are immediate -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#92b3ca">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tec Bot">
    <title>Tec Chatbot</title>
    <!-- Prevent FOUC (Flash of Unstyled Content) by applying theme before React loads -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // localStorage might not be available
        }
      })();
    </script>
    <meta name="description" content="Chatbot con procesamiento de lenguanje natural para contestar dudas generales sobre el tecnm." />
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Tec Chatbot" />
    <meta property="og:description" content="Chatbot con procesamiento de lenguanje natural para contestar dudas generales sobre el tecnm" />
    <meta property="og:url" content="https://chatbot.bryanquintana.com" />
    <meta property="og:site_name" content="Tec Chatbot" />
    <meta property="og:type" content="website" />
    <!-- <meta property="og:image" content="" /> -->
    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tec Chatbot" />
    <meta name="twitter:description" content="Chatbot con procesamiento de lenguanje natural para contestar dudas generales sobre el tecnm" />
    <!-- <meta name="twitter:image" content="" /> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
